spring.application.name=api-gateway
server.port=8090

#EUREKA_Registery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}

#Log routes
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

#Actuator (pour voir les routes : /actuator/gateway/routes)
management.endpoints.web.exposure.include=health,info,gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
springdoc.swagger-ui.urls[0].name=book-service
springdoc.swagger-ui.urls[0].url=/book-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=member-service
springdoc.swagger-ui.urls[1].url=/member-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=borrowing-service
springdoc.swagger-ui.urls[2].url=/borrowing-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=notification-service
springdoc.swagger-ui.urls[3].url=/notification-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=statistics-service
springdoc.swagger-ui.urls[4].url=/statistics-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=review-service
springdoc.swagger-ui.urls[5].url=/review-service/v3/api-docs
springdoc.swagger-ui.urls[6].name=fine-service
springdoc.swagger-ui.urls[6].url=/fine-service/v3/api-docs
springdoc.swagger-ui.urls[7].name=reservation-service
springdoc.swagger-ui.urls[7].url=/reservation-service/v3/api-docs

spring.cloud.gateway.routes[0].id=notification-service
spring.cloud.gateway.routes[0].uri=http://localhost:8084
spring.cloud.gateway.routes[0].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=statistics-service
spring.cloud.gateway.routes[1].uri=http://localhost:8085
spring.cloud.gateway.routes[1].predicates[0]=Path=/statistics-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1