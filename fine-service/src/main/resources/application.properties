spring.application.name=fine-service
server.port=8087

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/finedb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=medboss.19

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Member and Borrowing Services
services.member.url=http://member-service
services.borrowing.url=http://borrowing-service

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}