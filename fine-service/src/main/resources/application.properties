spring.application.name=fine-service
server.port=8087

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/finedb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=191929

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenFeign
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic
logging.level.com.library.fine.client=DEBUG

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/library