spring.application.name=borrowing-service
server.port=8083

# H2 en memoire
spring.datasource.url=jdbc:h2:mem:borrowingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Services appeles via Eureka (par leur nom)
services.book.url=http://book-service
services.member.url=http://member-service
services.notification.url=http://notification-service
services.timeout-ms=3000

# Duree d'emprunt par defaut (jours)
borrowing.default-days=14

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}